<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us - Narmada Nursery</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f8f5;
            margin: 0;
            padding: 0;
        }

        .contact-container {
            max-width: 600px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2e7d32;
        }

        .contact-card {
            margin-top: 20px;
        }

        .contact-card h2 {
            color: #388e3c;
            margin-bottom: 10px;
        }

        .contact-card p {
            margin: 5px 0;
            color: #555;
            line-height: 1.6;
        }
    </style>
</head>

<body>
    <div class="contact-container">
        <h1>Contact Us</h1>
        <div class="contact-card">
            <h2>Main Branch</h2>
            <p><strong>Address:</strong></p>
            <p>105, Eva Surbhi,<br>
                Opp. Aksharwadi Temple,<br>
                Waghawadi Road, Bhavnagar,<br>
                Gujarat, India</p>
            <p><strong>Email:</strong> info@narmada-nursery</p>
            <p><strong>Phone:</strong> +91-XXXXXXXXXX</p>
        </div>
    </div>
</body>

</html>
