<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dish Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container my-5">
        <h2 class="mb-4">Our Dishes</h2>
        <div class="row g-4">

            <!-- Dish Card Start -->
            <div class="col-md-3">
                <div class="card shadow">
                    <div class="card-header text-bg-primary">
                        <h5 class="card-title">Pav Bhaji</h5>
                    </div>
                    <div class="card-body">

                        <ul class="list-group list-group-flush">
                            <li class="list-group-item">Price: ₹120</li>
                            <li class="list-group-item">Weight: 300g</li>
                            <li class="list-group-item">Extra: Butter Pav</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
